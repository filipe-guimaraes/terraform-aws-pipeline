name: "Terraform Workflow"

on:
  workflow_call:
    inputs:
      environment:
        description: "The environment to deploy to (e.g., dev, staging, prod)"
        required: true
        type: string
      aws-assume-role-arn:
        description: "The ARN of the AWS IAM Role to assume for deployment"
        required: true
        type: string
      aws-region:
        description: "The AWS region to deploy to"
        required: true
        type: string
      aws-statefile-s3-bucket:
        description: "The name of the S3 bucket to use for Terraform state files"
        required: true
        type: string

jobs:
  terraform:
    runs-on: ubuntu-latest
  
    defaults:
      run:
        shell: bash
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.3"

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-assume-role-arn }}
          role-session-name: "GitHub_To_AWS_via_FederatedOIDC"
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform init
        id: terraform-init
        run: |
          cd infra && terraform init \
            -backend-config="bucket=${{ inputs.aws-statefile-s3-bucket }}" \
            -backend-config="key=terraform-aws-pipeline/statefile/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform fmt & validate
        run: terraform fmt && terraform validate

      - name: Terraform Plan
        id: terraform-plan
        run: |
          cd infra && terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} && \
          terraform plan -var-file="./envs/${{ inputs.environment }}/terraform.tfvars" -out="${{ inputs.environment }}.tfplan"

      - name: Terraform Apply
        id: terraform-apply
        run: |
          cd infra && terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} && \
          terraform apply "${{ inputs.environment }}.tfplan"